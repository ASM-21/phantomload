[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomload"
version = "0.2.0"
description = "61% of enrolled US demand response capacity goes unrealised each year, and public data shows that is not evidence of waste. EIA-861, PJM, FERC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Morrissey" }]
keywords = ["demand-response", "capacity-accreditation", "eia-861", "pjm", "resource-adequacy", "rule-of-three", "falsification", "reproducible-research"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["phantomload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
