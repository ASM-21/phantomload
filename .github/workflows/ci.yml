name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: tests
        run: pytest -q
      - name: run every track
        run: python run_all.py
      - name: claims guard
        run: python tools/check_claims.py
      - name: claim ledger is current
        run: |
          python tools/claim_ledger.py
          # The header line records the commit and environment the ledger was
          # generated in, which always differs in CI. Every other line is
          # deterministic and must match.
          git diff --exit-code -I '^Commit ' -- CLAIMS.md || (echo "CLAIMS.md is stale: run tools/claim_ledger.py" && exit 1)
      - name: source drift check
        run: python tools/check_source.py
